<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>First Light of Dawn — انفراج الفجر</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--night:#091C16;--ivory:#F6EEDB;--emerald:#155D43}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const LOOP=5,TAU=Math.PI*2,FONT='Cairo,"Segoe UI",system-ui,sans-serif';
let W,H,u,dpr,t0=0;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const RAMP=[[0,[9,28,22]],[.3,[25,102,75]],[.5,[116,168,126]],[.72,[236,178,84]],[1,[246,238,219]]];
function ramp(x){x=clamp(x);for(let i=1;i<RAMP.length;i++){if(x<=RAMP[i][0]){const a=RAMP[i-1],b=RAMP[i];return mix(a[1],b[1],(x-a[0])/(b[0]-a[0]))}}return RAMP[RAMP.length-1][1]}

let seed=7;
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const stars=Array.from({length:120},()=>({x:rnd(),y:Math.pow(rnd(),1.2)*.72,r:.7+rnd()*1.6,sp:1+rnd()*3,ph:rnd()*TAU,b:rnd()<.12}));
const motes=Array.from({length:46},()=>({x:rnd(),y:rnd(),r:rnd(),sp:.4+rnd(),ph:rnd()*TAU}));
const spr=document.createElement('canvas');spr.width=spr.height=64;
{const g=spr.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
r.addColorStop(0,'rgba(255,230,160,1)');r.addColorStop(.25,'rgba(255,214,120,.55)');r.addColorStop(1,'rgba(255,214,120,0)');
g.fillStyle=r;g.fillRect(0,0,64,64)}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  cv.style.width=W+'px';cv.style.height=H+'px';
  u=Math.min(W/1080,H/1920);
}

function mosque(cx,by,m){
  const s=u*m,bt=by-64*s,dt=bt-26*s;
  const rc=(x,y,w,h)=>ctx.fillRect(x,y,w,h);
  const dome=(x,y,rx,ry)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,Math.PI,TAU);ctx.fill()};
  rc(cx-130*s,bt,260*s,72*s);rc(cx-58*s,dt,116*s,28*s);
  dome(cx,dt,62*s,72*s);dome(cx-104*s,bt,38*s,34*s);dome(cx+104*s,bt,38*s,34*s);
  rc(cx-1.8*s,dt-104*s,3.6*s,32*s);
  ctx.beginPath();ctx.arc(cx,dt-108*s,6*s,0,TAU);ctx.fill();
  for(const k of[-1,1]){
    const mx=cx+k*170*s;
    rc(mx-8*s,by-232*s,16*s,242*s);rc(mx-14*s,by-198*s,28*s,9*s);
    ctx.beginPath();ctx.moveTo(mx-9*s,by-232*s);
    ctx.quadraticCurveTo(mx-9*s,by-262*s,mx,by-292*s);
    ctx.quadraticCurveTo(mx+9*s,by-262*s,mx+9*s,by-232*s);ctx.fill();
    rc(mx-1.2*s,by-310*s,2.4*s,20*s);
  }
}
function ridge(f,col){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W+8;x+=8)ctx.lineTo(x,f(x));
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}

function draw(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  const d=eio((t-.6)/1.5);
  const horizY=H*.865,lineY=horizY-26*u,hf=lineY/H;
  const farCrest=x=>{const xd=(x-W/2)/u;return horizY-u*(14+8*Math.sin(xd*.0045+.6)+5*Math.sin(xd*.013+2))};
  const nearCrest=x=>{const xd=(x-W/2)/u;return H*.955-u*(46+30*Math.sin(xd*.0035+4)+14*Math.sin(xd*.011+1))};

  const top=ramp(Math.pow(d,1.35)),mid=ramp(Math.pow(d,.9));
  const hor=mix(ramp(Math.min(1,d*1.35)),[16,54,42],Math.pow(1-d,3)*.9);
  const pm=hf-.06-.5*d,pl=pm+(hf-pm)*.5;
  const sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,rgb(top));sg.addColorStop(clamp(pm),rgb(mid));
  sg.addColorStop(clamp(pl),rgb(mix(mid,hor,.55)));sg.addColorStop(clamp(hf),rgb(hor));sg.addColorStop(1,rgb(hor));
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

  const sv=1-sm((d-.04)/.5);
  if(sv>.01){
    const base=Math.max(.55,u*1.7);
    for(const s of stars){
      const tw=.55+.45*Math.sin(t*s.sp+s.ph),r=s.r*base*(s.b?1.5:1),x=s.x*W,y=s.y*H;
      if(s.b){ctx.globalAlpha=sv*tw*.5;ctx.drawImage(spr,x-r*5,y-r*5,r*10,r*10)}
      ctx.globalAlpha=sv*tw*(s.b?1:.75);ctx.fillStyle='#FFF4D6';
      ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  const mv=.9*sm(t/.4)*(1-sm((d-.12)/.5));
  if(mv>.01){
    const Rm=84*u;
    ctx.save();ctx.translate(W/2+250*u,H*.15+Math.sin(t*.8)*3*u);ctx.rotate(-.5);ctx.globalAlpha=mv;
    const hg=ctx.createRadialGradient(0,0,0,0,0,Rm*3.4);
    hg.addColorStop(0,'rgba(229,185,76,.16)');hg.addColorStop(1,'rgba(229,185,76,0)');
    ctx.fillStyle=hg;ctx.fillRect(-Rm*3.4,-Rm*3.4,Rm*6.8,Rm*6.8);
    ctx.beginPath();ctx.rect(-Rm*2,-Rm*2,Rm*4,Rm*4);
    ctx.moveTo(Rm*1.22,-Rm*.05);ctx.arc(Rm*.3,-Rm*.05,Rm*.92,0,TAU);ctx.clip('evenodd');
    const cg=ctx.createLinearGradient(-Rm,-Rm,Rm,Rm);
    cg.addColorStop(0,'#F6DC8E');cg.addColorStop(.5,'#E5B94C');cg.addColorStop(1,'#B98F2E');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,Rm,0,TAU);ctx.fill();
    ctx.restore();
  }

  const gl=eo((t-.65)/1.7),ga=sm((t-.7)/.6)*(1-.5*sm((d-.8)/.2));
  if(ga>.01){
    const gr=Math.max(W*.8,H*.5)*(.3+.9*gl);
    ctx.save();ctx.translate(W/2,lineY);ctx.scale(1,1.1);
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=ga;
    const g=ctx.createRadialGradient(0,0,0,0,0,gr);
    g.addColorStop(0,'rgba(255,214,130,.9)');g.addColorStop(.25,'rgba(236,170,70,.5)');
    g.addColorStop(.6,'rgba(229,185,76,.16)');g.addColorStop(1,'rgba(229,185,76,0)');
    ctx.fillStyle=g;ctx.fillRect(-gr,-gr,gr*2,gr*2);ctx.restore();
  }

  const ln=eo((t-.6)/.85);
  if(ln>0){
    const half=W*.62*ln,a=sm((t-.6)/.3)*(1-.55*sm((t-1.8)/1));
    const lg=ctx.createLinearGradient(W/2-half,0,W/2+half,0);
    lg.addColorStop(0,'rgba(229,185,76,0)');lg.addColorStop(.5,'rgba(255,230,160,1)');lg.addColorStop(1,'rgba(229,185,76,0)');
    ctx.globalCompositeOperation='lighter';ctx.fillStyle=lg;
    ctx.globalAlpha=a;ctx.fillRect(W/2-half,lineY-1.6*u,half*2,3.2*u);
    ctx.globalAlpha=a*.35;ctx.fillRect(W/2-half,lineY-10*u,half*2,20*u);
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  }

  const ra=sm((d-.12)/.45)*(1-.5*sm((d-.78)/.22));
  if(ra>.01){
    const N=16,ox=W/2,oy=lineY+30*u,L=Math.hypot(W,H)*(.45+.6*eo(d));
    const rg=ctx.createRadialGradient(ox,oy,0,ox,oy,L);
    rg.addColorStop(0,'rgba(244,200,104,1)');rg.addColorStop(.5,'rgba(244,200,104,.4)');rg.addColorStop(1,'rgba(244,200,104,0)');
    ctx.fillStyle=rg;
    for(let i=0;i<N;i++){
      const f=i/(N-1),a=(-76+152*f+3*Math.sin(t*.7+i*1.3))*Math.PI/180;
      const w=(1.6+1.5*(.5+.5*Math.sin(i*2.1)))*Math.PI/180;
      ctx.globalAlpha=ra*.28*(.45+.55*(.5+.5*Math.sin(i*2.7+t*.9)))*(1-Math.abs(f-.5));
      ctx.beginPath();ctx.moveTo(ox,oy);
      ctx.lineTo(ox+Math.sin(a-w)*L,oy-Math.cos(a-w)*L);
      ctx.lineTo(ox+Math.sin(a+w)*L,oy-Math.cos(a+w)*L);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  const farC=mix([8,30,23],[104,158,133],d),mosC=mix([6,24,18],[58,118,93],d);
  ridge(farCrest,rgb(farC));
  ctx.fillStyle=rgb(mosC);
  mosque(W/2-290*u,horizY+4*u,1);mosque(W/2+370*u,horizY+4*u,.5);
  const hz=ctx.createLinearGradient(0,lineY-40*u,0,horizY+120*u);
  hz.addColorStop(0,'rgba(246,226,170,0)');hz.addColorStop(.35,`rgba(246,226,170,${.35*d})`);hz.addColorStop(1,'rgba(246,226,170,0)');
  ctx.fillStyle=hz;ctx.fillRect(0,lineY-40*u,W,160*u+(horizY-lineY));
  ridge(nearCrest,rgb(mix([5,16,12],[21,93,67],d)));

  const T=eo((t-1.35)/1.0),Tf=eo((t-1.35)/1.35);
  if(T>0){
    const ty=H*.4+(1-Tf)*46*u;
    const pg=ctx.createRadialGradient(W/2,ty+60*u,0,W/2,ty+60*u,560*u);
    pg.addColorStop(0,`rgba(246,238,219,${.55*T})`);pg.addColorStop(.5,`rgba(229,185,76,${.14*T})`);pg.addColorStop(1,'rgba(229,185,76,0)');
    ctx.fillStyle=pg;ctx.fillRect(0,ty-560*u,W,1240*u);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`800 ${250*u}px ${FONT}`;
    if('letterSpacing' in ctx)ctx.letterSpacing=(8*u)+'px';
    ctx.globalAlpha=T;ctx.fillStyle='#091C16';
    ctx.shadowColor=`rgba(229,185,76,${.95})`;ctx.shadowBlur=70*u*dpr;
    ctx.fillText('Mind',W/2,ty);ctx.fillText('Mind',W/2,ty);
    ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.fillText('Mind',W/2,ty);
    if('letterSpacing' in ctx)ctx.letterSpacing='0px';
    const A=eo((t-1.75)/.85),Af=eo((t-1.75)/1.2);
    if(A>0){
      const dy=ty+150*u+(1-Af)*20*u,hw=150*u;
      const dg=ctx.createLinearGradient(W/2-hw,0,W/2+hw,0);
      dg.addColorStop(0,'rgba(201,152,40,0)');dg.addColorStop(.5,'rgba(201,152,40,1)');dg.addColorStop(1,'rgba(201,152,40,0)');
      ctx.globalAlpha=A*.9;ctx.fillStyle=dg;ctx.fillRect(W/2-hw,dy-.8,hw*2,Math.max(1.2,1.6*u));
      ctx.save();ctx.translate(W/2,dy);ctx.rotate(Math.PI/4);ctx.fillStyle='#E5B94C';
      ctx.fillRect(-6*u,-6*u,12*u,12*u);ctx.restore();
      ctx.globalAlpha=A;ctx.fillStyle='#155D43';ctx.direction='rtl';
      ctx.font=`600 ${68*u}px ${FONT}`;
      ctx.fillText('صفاء الذهن.. وبركة الوقت',W/2,ty+225*u+(1-Af)*30*u);
      ctx.direction='ltr';
    }
    ctx.globalAlpha=1;
  }

  const mi=sm((t-2.0)/1.0);
  if(mi>0){
    for(const m of motes){
      const fy=((m.y-t*.018*m.sp)%1+1)%1,x=m.x*W+Math.sin(t*.9*m.sp+m.ph)*26*u,y=fy*H*.82,s=(14+m.r*22)*u;
      ctx.globalAlpha=mi*.9*(.3+.7*Math.pow(.5+.5*Math.sin(t*1.6*m.sp+m.ph),2));
      ctx.drawImage(spr,x-s/2,y-s/2,s,s);
    }
    ctx.globalAlpha=1;
  }

  const vg=ctx.createRadialGradient(W/2,H*.5,Math.min(W,H)*.25,W/2,H*.5,Math.hypot(W,H)*.55);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,rgb(mix([4,14,10],[150,110,50],d),.42-.3*d));
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function frame(now){
  const elapsed = (now - t0) / 1000;
  draw(Math.min(elapsed, 3.8));
  if (elapsed < 3.8) requestAnimationFrame(frame);
}
resize();addEventListener('resize',resize);
t0=performance.now();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
