name: Build Mind Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Mind APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official Arabic Fonts (Cairo & Amiri Quran)
        run: |
          mkdir -p app/src/main/res/font
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o app/src/main/res/font/cairo.ttf
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/amiriquran/AmiriQuran-Regular.ttf" -o app/src/main/res/font/amiri_quran.ttf

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Generate Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Wrapper & Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Mind APK
        uses: actions/upload-artifact@v4
        with:
          name: Mind-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
